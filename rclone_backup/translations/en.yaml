---
configuration:
  jobs:
    name: Jobs
    description: The rclone jobs to run. See the Documentation tab for every option.
    fields:
      command:
        name: Command
        description: >-
          The rclone command to run, for example sync, copy, move, delete or ls.
      schedule:
        name: Schedule
        description: >-
          Cron: minute hour day month weekday (10 4 * * * is 04:10 every day).
          Or @hourly, @daily, @weekly, @every 6h. Empty: run at start-up.
